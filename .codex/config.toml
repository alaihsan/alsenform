[mcp_servers.laravel-boost]
command = "php"
# Boost is off while APP_ENV=production, as on the school's server; --env=local turns it on in
# this process only, never on the pages the server serves.
args = ["artisan", "boost:mcp", "--env=local"]

[mcp_servers.laravel-boost.tools.search-docs]
approval_mode = "approve"
